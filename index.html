<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<meta http-equiv="Cache-Control" content="no-store, no-cache, must-revalidate">
<meta http-equiv="Pragma" content="no-cache">
<title>cam</title>
<style>
  :root { color-scheme: dark; }
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body { height: 100%; background: #000; overflow: hidden; }
  body { display: flex; align-items: center; justify-content: center; font-family: system-ui, sans-serif; }
  video { width: 100%; height: 100%; object-fit: contain; background: #000; display: block; }
  #msg {
    position: fixed; inset: 0; display: flex; align-items: center; justify-content: center;
    text-align: center; padding: 24px; color: #888; font-size: 15px; line-height: 1.6;
    background: #000; z-index: 10; -webkit-user-select: none; user-select: none;
  }
  #msg.hidden { display: none; }
  #msg b { color: #ccc; }
  #tap {
    position: fixed; inset: 0; display: none; align-items: center; justify-content: center;
    background: rgba(0,0,0,.55); color: #fff; font-size: 20px; z-index: 20;
    -webkit-user-select: none; user-select: none;
  }
  #tap.show { display: flex; }
  .dot { display:inline-block; width:8px; height:8px; border-radius:50%; background:#3b82f6; margin-right:8px; vertical-align:middle; animation:pulse 1.4s ease-in-out infinite; }
  @keyframes pulse { 0%,100%{opacity:.3} 50%{opacity:1} }
  form { display:flex; flex-direction:column; gap:12px; max-width:320px; margin:0 auto; }
  input, button { font-size:16px; padding:12px; border-radius:8px; border:1px solid #333; background:#111; color:#eee; }
  button { background:#1d4ed8; border-color:#1d4ed8; cursor:pointer; }
</style>
</head>
<body>
  <video id="v" autoplay playsinline muted></video>
  <div id="msg"><span></span></div>
  <div id="tap">👆 toque para ligar o som</div>

<script src="https://cdn.jsdelivr.net/npm/peerjs@1.5.4/dist/peerjs.min.js"></script>
<script>
/* ==========================================================================
   SEM SEGREDO NO CÓDIGO.
   A chave vem da URL, no fragmento (#...), que nunca é enviado ao servidor
   nem fica no repositório. Ex.:  .../?host#MINHACHAVE   e   .../?view#MINHACHAVE
   ROOM (id no broker) = derivado da chave => sem a chave, ninguém conecta.
   ========================================================================== */

const BUILD = "b6-dedupe";
const ICE = [
  { urls: "stun:stun.l.google.com:19302" },
  { urls: "stun:stun1.l.google.com:19302" },
  { urls: "stun:stun2.l.google.com:19302" },
  { urls: "stun:stun.cloudflare.com:3478" },
  { urls: "stun:stun.nextcloud.com:3478" },
];
const PEER_OPTS = { config: { iceServers: ICE } };

/* ============================  DIAGNÓSTICO  ================================
   Telemetria real -> ntfy.sh (POST/GET anônimo). Publica eventos do device
   (host/celular) num tópico que o dev lê pelo shell. Não loga a chave.
   ========================================================================== */
const DIAG = true;
const DIAG_TOPIC = "cam-diag-c9d48d346d2b77e3";
const DEV = (navigator.userAgent.match(/Android|iPhone|iPad|Windows|Macintosh|Linux/i) || ["?"])[0];
let ROLE = "?";
/* ntfy anônimo limita rajadas (429): linhas vão pra fila e saem em lote */
const DIAG_Q = [];
let diagT = null;
function diagFlush() {
  clearTimeout(diagT); diagT = null;
  while (DIAG_Q.length) {
    let body = "";
    while (DIAG_Q.length && body.length + DIAG_Q[0].length < 3500) body += DIAG_Q.shift() + "\n";
    if (!body) body = DIAG_Q.shift().slice(0, 3500);
    try {
      fetch("https://ntfy.sh/" + DIAG_TOPIC, { method: "POST", body, keepalive: true })
        .catch(() => {});
    } catch (e) {}
  }
}
addEventListener("pagehide", diagFlush);
function rpt(tag, obj) {
  const line = ROLE + " | " + DEV + " | " + tag + " | " + (obj ? JSON.stringify(obj) : "");
  try { console.log("[cam]", line); } catch (e) {}
  if (!DIAG) return;
  DIAG_Q.push(line);
  if (!diagT) diagT = setTimeout(diagFlush, 4000);
}
/* observa uma RTCPeerConnection: candidatos + estados + par selecionado */
function watchPC(pc, tag) {
  if (!pc) return;
  try {
    // candidatos: só conta por tipo/protocolo e reporta um resumo no fim
    const cands = {};
    pc.addEventListener("icecandidate", e => {
      if (!e.candidate) { rpt(tag + ".cand", { done: true, cands }); return; }
      const c = e.candidate.candidate || "";
      const k = ((c.match(/ typ (\w+)/) || [])[1] || "?") + "/"
              + ((c.match(/ (udp|tcp) /i) || [])[1] || "?").toLowerCase();
      cands[k] = (cands[k] || 0) + 1;
    });
    pc.addEventListener("icecandidateerror", e =>
      rpt(tag + ".candErr", { code: e.errorCode, url: e.url, txt: (e.errorText||"").slice(0,60) }));
    pc.addEventListener("iceconnectionstatechange", () =>
      rpt(tag + ".ice", { s: pc.iceConnectionState }));
    pc.addEventListener("connectionstatechange", () =>
      rpt(tag + ".conn", { s: pc.connectionState }));
  } catch (e) {}
  // dump periódico do par selecionado + tipos de candidato reunidos
  let n = 0;
  const iv = setInterval(async () => {
    n++;
    if (!pc || pc.connectionState === "closed" || n > 10) { clearInterval(iv); return; }
    try {
      const stats = await pc.getStats();
      const loc = {}, rem = {}; let sel = null; const byId = {};
      stats.forEach(r => {
        if (r.type === "local-candidate")  { loc[r.candidateType] = (loc[r.candidateType]||0)+1; byId[r.id]=r; }
        if (r.type === "remote-candidate") { rem[r.candidateType] = (rem[r.candidateType]||0)+1; byId[r.id]=r; }
        if (r.type === "candidate-pair" && (r.nominated || r.selected || r.state === "succeeded")) sel = r;
      });
      let pair = null;
      if (sel) pair = {
        st: sel.state,
        L: byId[sel.localCandidateId]  ? byId[sel.localCandidateId].candidateType  : "?",
        R: byId[sel.remoteCandidateId] ? byId[sel.remoteCandidateId].candidateType : "?"
      };
      rpt(tag + ".stat", { i: n, ice: pc.iceConnectionState, cn: pc.connectionState, loc, rem, pair });
    } catch (e) { rpt(tag + ".statErr", { e: String(e).slice(0,50) }); }
  }, 2500);
}

const video  = document.getElementById("v");
const msgBox = document.getElementById("msg");
const msgTxt = msgBox.querySelector("span");
const tap    = document.getElementById("tap");

const params = new URLSearchParams(location.search);
const mode = params.get("mode")
          || (location.search.includes("host") ? "host"
          :  location.search.includes("view") ? "view" : null);

function say(html) { msgTxt.innerHTML = html; msgBox.classList.remove("hidden"); }
function hide()    { msgBox.classList.add("hidden"); }

/* deriva um id estável e opaco a partir da chave (SHA-256 hex) */
async function roomFromKey(key) {
  const buf = await crypto.subtle.digest("SHA-256", new TextEncoder().encode("cam|" + key));
  return "cam-" + Array.from(new Uint8Array(buf)).slice(0, 16)
                       .map(b => b.toString(16).padStart(2, "0")).join("");
}

function getKey() {
  return decodeURIComponent((location.hash || "").replace(/^#/, "")).trim();
}

/* pede a chave se não houver no #fragmento */
function askKey() {
  return new Promise(resolve => {
    msgBox.innerHTML = "";
    const f = document.createElement("form");
    f.innerHTML = '<b style="color:#ccc">chave de acesso</b>'
                + '<input id="k" type="password" autocomplete="off" placeholder="cole a chave">'
                + '<button type="submit">entrar</button>';
    msgBox.appendChild(f);
    msgBox.classList.remove("hidden");
    f.addEventListener("submit", e => {
      e.preventDefault();
      const v = f.querySelector("#k").value.trim();
      if (!v) return;
      location.hash = encodeURIComponent(v);
      resolve(v);
    });
  });
}

/* =================================  HOST (PC)  =============================
   Host INICIA a chamada (oferta já carrega webcam+áudio). Viewer só anuncia
   presença por um data-channel; host então liga pra ele.
   ========================================================================== */
async function runHost(key) {
  ROLE = "HOST";
  const ROOM = await roomFromKey(key);
  rpt("boot", { b: BUILD, room: ROOM.slice(0, 12) });
  say('<span class="dot"></span>ligando câmera…');
  let stream;
  try {
    stream = await navigator.mediaDevices.getUserMedia({
      video: { width: { ideal: 1280 }, height: { ideal: 720 } },
      audio: { echoCancellation: true, noiseSuppression: true }
    });
    rpt("gum.ok", { tracks: stream.getTracks().map(t => t.kind) });
  } catch (e) {
    rpt("gum.fail", { e: String(e.name || e).slice(0, 40) });
    say("<b>sem acesso à câmera/mic</b><br>" + e.message + "<br><br>Permita câmera e microfone.");
    return;
  }
  video.srcObject = stream;
  const viewers = {};

  function callViewer(id) {
    try { if (viewers[id]) viewers[id].close(); } catch (e) {}
    rpt("callViewer", { id: (id || "").slice(0, 8) });
    const call = peer.call(id, stream);       // oferta COM trilhas
    viewers[id] = call;
    watchPC(call.peerConnection, "host");
    call.on("close", () => { delete viewers[id]; rpt("call.close"); });
    say('<span class="dot"></span>celular conectado ✓<br><small>transmitindo.</small>');
  }

  let peer;
  function start() {
    peer = new Peer(ROOM, PEER_OPTS);
    peer.on("open", () => { rpt("peer.open"); say('<span class="dot"></span>online — esperando o celular…<br><small>pode minimizar. LED da câmera fica aceso.</small>'); });
    // viewer chega e anuncia presença via data-channel:
    peer.on("connection", conn => {
      rpt("conn.in", { peer: (conn.peer || "").slice(0, 8) });
      conn.on("data", d => { if (d === "hi") callViewer(conn.peer); });
    });
    // fallback: se um viewer antigo ligar direto, responde com a stream:
    peer.on("call", call => { rpt("call.in"); call.answer(stream); watchPC(call.peerConnection, "host-ans"); });
    peer.on("disconnected", () => { rpt("peer.disc"); peer.reconnect(); });
    peer.on("error", err => {
      rpt("peer.err", { t: err.type });
      if (err.type === "unavailable-id") {
        say("<b>já tem um HOST aberto</b><br>Feche o outro. Retentando…");
        setTimeout(() => { try { peer.destroy(); } catch(e){} start(); }, 5000);
      }
    });
  }
  start();
}

/* ================================  VIEW (celular)  =========================
   Viewer abre data-channel pro host (anuncia presença) e ESPERA a chamada.
   ========================================================================== */
async function runView(key) {
  ROLE = "VIEW";
  const ROOM = await roomFromKey(key);
  rpt("boot", { b: BUILD, room: ROOM.slice(0, 12) });
  say('<span class="dot"></span>conectando…');
  let peer, conn, retry, got = false, tries = 0;

  function announce() {
    clearTimeout(retry);
    tries++;
    rpt("announce", { n: tries });
    try { if (conn) conn.close(); } catch (e) {}
    conn = peer.connect(ROOM, { reliable: true });
    conn.on("open", () => { rpt("conn.open"); try { conn.send("hi"); } catch (e) {} });
    conn.on("error", e => rpt("conn.err", { e: String(e.type || e).slice(0, 30) }));
    // se não receber vídeo em 12s, reanuncia
    retry = setTimeout(() => { if (!got) { rpt("timeout.noStream"); announce(); } }, 12000);
  }

  function start() {
    got = false;
    peer = new Peer(PEER_OPTS);
    peer.on("open", id => { rpt("peer.open", { id: (id||"").slice(0,8) }); announce(); });
    peer.on("call", call => {
      rpt("call.in");
      call.answer();                          // só recebe
      watchPC(call.peerConnection, "view");
      call.on("stream", remote => {
        if (video.srcObject === remote) return;
        rpt("stream.get", { tracks: remote.getTracks().map(t => t.kind) });
        got = true; clearTimeout(retry);
        video.srcObject = remote; hide();
        video.play().then(() => rpt("play.ok")).catch(e => rpt("play.fail", { e: String(e.name||e).slice(0,30) }));
        if (video.muted) tap.classList.add("show");
      });
      call.on("close", () => { got = false; rpt("call.close"); say('<span class="dot"></span>reconectando…'); announce(); });
    });
    peer.on("disconnected", () => { rpt("peer.disc"); peer.reconnect(); });
    peer.on("error", err => {
      rpt("peer.err", { t: err.type });
      if (err.type === "peer-unavailable")
        say('<span class="dot"></span>HOST offline — abra <b>?host</b> no PC.<br>tentando…');
      clearTimeout(retry); retry = setTimeout(() => { if (!got) announce(); }, 3000);
    });
  }

  tap.addEventListener("click", () => {
    video.muted = false; video.play().catch(() => {});
    tap.classList.remove("show");
  });
  start();
}

/* ==============================  ROTEADOR  ================================= */
(async () => {
  if (!mode) {
    say("<b>cam</b><br><br>PC (webcam): abra <b>?host#SUACHAVE</b><br>"
      + "Celular: abra <b>?view#SUACHAVE</b>");
    return;
  }
  let key = getKey();
  if (!key) key = await askKey();
  if (mode === "host") runHost(key);
  else runView(key);
})();
</script>
</body>
</html>

<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<meta http-equiv="Cache-Control" content="no-store, no-cache, must-revalidate">
<meta http-equiv="Pragma" content="no-cache">
<title>cam</title>
<style>
  :root { color-scheme: dark; }
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body { height: 100%; background: #000; overflow: hidden; }
  body { display: flex; align-items: center; justify-content: center; font-family: system-ui, sans-serif; }
  video { width: 100%; height: 100%; object-fit: contain; background: #000; display: block; }
  #msg {
    position: fixed; inset: 0; display: flex; align-items: center; justify-content: center;
    text-align: center; padding: 24px; color: #888; font-size: 15px; line-height: 1.6;
    background: #000; z-index: 10; -webkit-user-select: none; user-select: none;
  }
  #msg.hidden { display: none; }
  #msg b { color: #ccc; }
  #tap {
    position: fixed; inset: 0; display: none; align-items: center; justify-content: center;
    background: rgba(0,0,0,.55); color: #fff; font-size: 20px; z-index: 20;
    -webkit-user-select: none; user-select: none;
  }
  #tap.show { display: flex; }
  .dot { display:inline-block; width:8px; height:8px; border-radius:50%; background:#3b82f6; margin-right:8px; vertical-align:middle; animation:pulse 1.4s ease-in-out infinite; }
  @keyframes pulse { 0%,100%{opacity:.3} 50%{opacity:1} }
  input, button { font-size:16px; padding:12px; border-radius:8px; border:1px solid #333; background:#111; color:#eee; }
  button { background:#1d4ed8; border-color:#1d4ed8; cursor:pointer; }
  #bar {
    position: fixed; left: 0; right: 0; bottom: 0; z-index: 30; display: flex; gap: 10px;
    align-items: center; justify-content: center;
    padding: 12px 16px calc(12px + env(safe-area-inset-bottom));
    background: linear-gradient(transparent, rgba(0,0,0,.75));
  }
  #bar.hidden { display: none; }
  #bar button { padding: 10px 16px; font-size: 15px; background: #111; border-color: #333; }
  #bar button:disabled { opacity: .4; cursor: default; }
  #recBtn.on { background: #b91c1c; border-color: #b91c1c; }
  #recInfo { color: #ddd; font-size: 14px; font-variant-numeric: tabular-nums; }
</style>
</head>
<body>
  <video id="v" autoplay playsinline muted></video>
  <div id="msg"><span></span></div>
  <div id="tap">👆 toque para ligar o som</div>
  <div id="bar" class="hidden">
    <button id="recBtn" disabled>● rec</button>
    <span id="recInfo"></span>
    <button id="dirBtn" hidden>pasta</button>
  </div>

<script src="https://cdn.jsdelivr.net/npm/peerjs@1.5.4/dist/peerjs.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/fix-webm-duration@1.0.6/fix-webm-duration.js"></script>
<script>
/* ==========================================================================
   SEM CHAVE: abre direto em .../?host e .../?view (sala fixa).
   ATENÇÃO: quem souber o link vê a câmera. Chave opcional no fragmento
   (.../?host#CHAVE e .../?view#CHAVE) cria uma sala separada.
   ROOM (id no broker) = SHA-256 da chave (ou da chave padrão).
   ========================================================================== */

const BUILD = "b9-semchave";
const ICE = [
  { urls: "stun:stun.l.google.com:19302" },
  { urls: "stun:stun1.l.google.com:19302" },
  { urls: "stun:stun2.l.google.com:19302" },
  { urls: "stun:stun.cloudflare.com:3478" },
  { urls: "stun:stun.nextcloud.com:3478" },
];
const PEER_OPTS = { config: { iceServers: ICE } };

/* ============================  DIAGNÓSTICO  ================================
   Telemetria real -> ntfy.sh (POST/GET anônimo). Publica eventos do device
   (host/celular) num tópico que o dev lê pelo shell. Não loga a chave.
   ========================================================================== */
const DIAG = true;
const DIAG_TOPIC = "cam-diag-c9d48d346d2b77e3";
const DEV = (navigator.userAgent.match(/Android|iPhone|iPad|Windows|Macintosh|Linux/i) || ["?"])[0];
let ROLE = "?";
/* ntfy anônimo limita rajadas (429): linhas vão pra fila e saem em lote */
const DIAG_Q = [];
let diagT = null;
function diagFlush() {
  clearTimeout(diagT); diagT = null;
  while (DIAG_Q.length) {
    let body = "";
    while (DIAG_Q.length && body.length + DIAG_Q[0].length < 3500) body += DIAG_Q.shift() + "\n";
    if (!body) body = DIAG_Q.shift().slice(0, 3500);
    try {
      fetch("https://ntfy.sh/" + DIAG_TOPIC, { method: "POST", body, keepalive: true })
        .catch(() => {});
    } catch (e) {}
  }
}
addEventListener("pagehide", diagFlush);
function rpt(tag, obj) {
  const line = ROLE + " | " + DEV + " | " + tag + " | " + (obj ? JSON.stringify(obj) : "");
  try { console.log("[cam]", line); } catch (e) {}
  if (!DIAG) return;
  DIAG_Q.push(line);
  if (!diagT) diagT = setTimeout(diagFlush, 4000);
}
/* observa uma RTCPeerConnection: candidatos + estados + par selecionado */
function watchPC(pc, tag) {
  if (!pc) return;
  try {
    // candidatos: só conta por tipo/protocolo e reporta um resumo no fim
    const cands = {};
    pc.addEventListener("icecandidate", e => {
      if (!e.candidate) { rpt(tag + ".cand", { done: true, cands }); return; }
      const c = e.candidate.candidate || "";
      const k = ((c.match(/ typ (\w+)/) || [])[1] || "?") + "/"
              + ((c.match(/ (udp|tcp) /i) || [])[1] || "?").toLowerCase();
      cands[k] = (cands[k] || 0) + 1;
    });
    pc.addEventListener("icecandidateerror", e =>
      rpt(tag + ".candErr", { code: e.errorCode, url: e.url, txt: (e.errorText||"").slice(0,60) }));
    pc.addEventListener("iceconnectionstatechange", () =>
      rpt(tag + ".ice", { s: pc.iceConnectionState }));
    pc.addEventListener("connectionstatechange", () =>
      rpt(tag + ".conn", { s: pc.connectionState }));
  } catch (e) {}
  // dump periódico do par selecionado + tipos de candidato reunidos
  let n = 0;
  const iv = setInterval(async () => {
    n++;
    if (!pc || pc.connectionState === "closed" || n > 10) { clearInterval(iv); return; }
    try {
      const stats = await pc.getStats();
      const loc = {}, rem = {}; let sel = null; const byId = {};
      stats.forEach(r => {
        if (r.type === "local-candidate")  { loc[r.candidateType] = (loc[r.candidateType]||0)+1; byId[r.id]=r; }
        if (r.type === "remote-candidate") { rem[r.candidateType] = (rem[r.candidateType]||0)+1; byId[r.id]=r; }
        if (r.type === "candidate-pair" && (r.nominated || r.selected || r.state === "succeeded")) sel = r;
      });
      let pair = null;
      if (sel) pair = {
        st: sel.state,
        L: byId[sel.localCandidateId]  ? byId[sel.localCandidateId].candidateType  : "?",
        R: byId[sel.remoteCandidateId] ? byId[sel.remoteCandidateId].candidateType : "?"
      };
      rpt(tag + ".stat", { i: n, ice: pc.iceConnectionState, cn: pc.connectionState, loc, rem, pair });
    } catch (e) { rpt(tag + ".statErr", { e: String(e).slice(0,50) }); }
  }, 2500);
}

const video  = document.getElementById("v");
const msgBox = document.getElementById("msg");
const msgTxt = msgBox.querySelector("span");
const tap    = document.getElementById("tap");
const bar     = document.getElementById("bar");
const recBtn  = document.getElementById("recBtn");
const recInfo = document.getElementById("recInfo");
const dirBtn  = document.getElementById("dirBtn");

const params = new URLSearchParams(location.search);
const mode = params.get("mode")
          || (location.search.includes("host") ? "host"
          :  location.search.includes("view") ? "view" : null);

function say(html) { msgTxt.innerHTML = html; msgBox.classList.remove("hidden"); }
function hide()    { msgBox.classList.add("hidden"); }

/* deriva um id estável e opaco a partir da chave (SHA-256 hex) */
async function roomFromKey(key) {
  const buf = await crypto.subtle.digest("SHA-256", new TextEncoder().encode("cam|" + key));
  return "cam-" + Array.from(new Uint8Array(buf)).slice(0, 16)
                       .map(b => b.toString(16).padStart(2, "0")).join("");
}

function getKey() {
  return decodeURIComponent((location.hash || "").replace(/^#/, "")).trim();
}

/* ==================================  REC  ==================================
   Gravação roda no HOST, sobre a stream local (qualidade original, sem perda
   da rede). Partes de 10 min, webm 1,5 Mbps (~700 MB/h), duração corrigida.
   Aberto via localhost (server.py): PUT /rec/<arquivo> => ./gravacoes do projeto.
   Senão: pasta escolhida (File System Access) ou Downloads.
   O celular só manda {rec:"start"|"stop"} pelo data-channel; o host devolve
   {rec:bool, el:ms} pra todos os viewers.
   ========================================================================== */
const REC_BPS = 1500000;
const REC_PART_MS = (+params.get("part") || 600) * 1000;   // ?part=SEG só pra teste
const REC_MIME = ["video/webm;codecs=vp9,opus", "video/webm;codecs=vp8,opus", "video/webm"]
  .find(m => window.MediaRecorder && MediaRecorder.isTypeSupported(m)) || "";
const rec = { on: false, since: 0, part: 0, name: "", mr: null, dir: null, oldDir: null, onchange: () => {},
              srv: /^(127\.0\.0\.1|localhost|\[::1\])$/.test(location.hostname) };

function hms(ms) {
  const s = Math.max(0, Math.floor(ms / 1000)), p = x => String(x).padStart(2, "0");
  return p(Math.floor(s / 3600)) + ":" + p(Math.floor(s / 60) % 60) + ":" + p(s % 60);
}

function recStart(stream) {
  if (rec.on || !REC_MIME) return;
  const d = new Date(), p = x => String(x).padStart(2, "0");
  rec.name = "cam-" + d.getFullYear() + "-" + p(d.getMonth() + 1) + "-" + p(d.getDate())
           + "_" + p(d.getHours()) + "-" + p(d.getMinutes()) + "-" + p(d.getSeconds());
  rec.on = true; rec.since = Date.now(); rec.part = 0; rec.videoOnly = false;
  recPart(stream);
  rpt("rec.start", { mime: REC_MIME, dir: !!rec.dir });
  rec.onchange();
}

function recStop() {
  if (!rec.on) return;
  rec.on = false;
  try { rec.mr.stop(); } catch (e) {}
  rpt("rec.stop", { s: Math.round((Date.now() - rec.since) / 1000) });
  rec.onchange();
}

/* uma parte = um MediaRecorder; ao fim de REC_PART_MS troca por outro */
function recPart(stream) {
  const chunks = [], t0 = Date.now(), n = ++rec.part;
  const src = rec.videoOnly ? new MediaStream(stream.getVideoTracks()) : stream;
  const mr = new MediaRecorder(src, { mimeType: REC_MIME, videoBitsPerSecond: REC_BPS, audioBitsPerSecond: 128000 });
  rec.mr = mr;
  mr.ondataavailable = e => { if (e.data && e.data.size) chunks.push(e.data); };
  mr.onerror = e => rpt("rec.err", { e: String((e.error && e.error.name) || e).slice(0, 40) });
  const cut = setTimeout(() => { if (rec.on && rec.mr === mr) { recPart(stream); mr.stop(); } }, REC_PART_MS);
  // áudio que não entrega amostras trava o muxer (0 bytes): refaz só com vídeo
  const dog = setTimeout(() => {
    if (rec.on && rec.mr === mr && !chunks.length && !rec.videoOnly) {
      rpt("rec.noData"); rec.videoOnly = true; rec.part--; recPart(stream); mr.stop();
    }
  }, 12000);
  mr.onstop = () => {
    clearTimeout(cut); clearTimeout(dog);
    recSave(new Blob(chunks, { type: "video/webm" }), Date.now() - t0, n);
    // parou sozinho (câmera caiu etc.)
    if (rec.on && rec.mr === mr) { rec.on = false; rpt("rec.endedAlone"); rec.onchange(); }
  };
  mr.start(5000);
}

async function recSave(blob, ms, n) {
  if (!blob.size) { rpt("rec.empty", { n }); return; }
  const file = rec.name + "_parte" + String(n).padStart(2, "0") + ".webm";
  if (window.ysFixWebmDuration) {
    try { blob = await ysFixWebmDuration(blob, ms, { logger: false }); } catch (e) {}
  }
  rpt("rec.save", { n, mb: +(blob.size / 1048576).toFixed(1), s: Math.round(ms / 1000),
                    to: rec.srv ? "projeto" : rec.dir ? "pasta" : "downloads" });
  if (rec.srv) {
    try {
      const r = await fetch("/rec/" + file, { method: "PUT", body: blob });
      if (r.ok) return;
      rpt("rec.srvErr", { st: r.status });
    } catch (e) { rpt("rec.srvErr", { e: String(e.name || e).slice(0, 40) }); }
  }
  if (rec.dir) {
    try {
      const fh = await rec.dir.getFileHandle(file, { create: true });
      const w = await fh.createWritable();
      await w.write(blob); await w.close();
      return;
    } catch (e) { rpt("rec.dirErr", { e: String(e.name || e).slice(0, 40) }); }
  }
  const a = document.createElement("a");
  a.href = URL.createObjectURL(blob); a.download = file;
  document.body.appendChild(a); a.click(); a.remove();
  setTimeout(() => URL.revokeObjectURL(a.href), 60000);
}

/* pasta de gravação: handle guardado no IndexedDB entre sessões */
function dirStore(val) {
  return new Promise(res => {
    try {
      const r = indexedDB.open("cam", 1);
      r.onupgradeneeded = () => r.result.createObjectStore("kv");
      r.onerror = () => res(null);
      r.onsuccess = () => {
        const s = r.result.transaction("kv", val ? "readwrite" : "readonly").objectStore("kv");
        const q = val ? s.put(val, "dir") : s.get("dir");
        q.onsuccess = () => res(q.result || null);
        q.onerror = () => res(null);
      };
    } catch (e) { res(null); }
  });
}

async function dirRestore() {
  const h = await dirStore();
  if (!h) return;
  try {
    if (await h.queryPermission({ mode: "readwrite" }) === "granted") rec.dir = h;
    else rec.oldDir = h;               // precisa de clique pra reautorizar
  } catch (e) {}
}

async function dirPick() {
  try {
    if (rec.oldDir && await rec.oldDir.requestPermission({ mode: "readwrite" }) === "granted") {
      rec.dir = rec.oldDir; rec.oldDir = null;
    } else {
      rec.dir = await showDirectoryPicker({ id: "cam-rec", mode: "readwrite" });
      rec.oldDir = null;
      dirStore(rec.dir);
    }
    rpt("rec.dir", { ok: true });
  } catch (e) { rpt("rec.dir", { ok: false, e: String(e.name || e).slice(0, 30) }); }
  rec.onchange();
}

/* =================================  HOST (PC)  =============================
   Host INICIA a chamada (oferta já carrega webcam+áudio). Viewer só anuncia
   presença por um data-channel; host então liga pra ele.
   ========================================================================== */
async function runHost(key) {
  ROLE = "HOST";
  const ROOM = await roomFromKey(key);
  rpt("boot", { b: BUILD, room: ROOM.slice(0, 12) });
  say('<span class="dot"></span>ligando câmera…');
  let stream;
  try {
    stream = await navigator.mediaDevices.getUserMedia({
      video: { width: { ideal: 1280 }, height: { ideal: 720 } },
      audio: { echoCancellation: true, noiseSuppression: true }
    });
    rpt("gum.ok", { tracks: stream.getTracks().map(t => t.kind) });
  } catch (e) {
    rpt("gum.fail", { e: String(e.name || e).slice(0, 40) });
    say("<b>sem acesso à câmera/mic</b><br>" + e.message + "<br><br>Permita câmera e microfone.");
    return;
  }
  video.srcObject = stream;
  const viewers = {};
  const conns = new Set();

  // ---- rec: UI local + estado espelhado nos viewers
  const recMsg = () => ({ rec: rec.on, el: rec.on ? Date.now() - rec.since : 0 });
  function recUI() {
    recBtn.disabled = !REC_MIME;
    recBtn.classList.toggle("on", rec.on);
    recBtn.textContent = rec.on ? "■ parar" : "● rec";
    const dest = rec.srv ? "projeto/gravacoes" : rec.dir ? "pasta: " + rec.dir.name : "Downloads";
    recInfo.textContent = !REC_MIME ? "navegador não grava webm"
                        : rec.on ? hms(Date.now() - rec.since) + " · " + dest : dest;
    dirBtn.textContent = rec.oldDir && !rec.dir ? "reautorizar pasta" : "pasta";
  }
  rec.onchange = () => {
    recUI();
    const m = recMsg();
    conns.forEach(c => { try { if (c.open) c.send(m); } catch (e) {} });
  };
  recBtn.onclick = () => rec.on ? recStop() : recStart(stream);
  dirBtn.hidden = rec.srv || !window.showDirectoryPicker;
  dirBtn.onclick = dirPick;
  setInterval(() => { if (rec.on) recUI(); }, 1000);
  addEventListener("beforeunload", e => { if (rec.on) { e.preventDefault(); e.returnValue = ""; } });
  bar.classList.remove("hidden");
  recUI();
  dirRestore().then(recUI);

  function callViewer(id) {
    try { if (viewers[id]) viewers[id].close(); } catch (e) {}
    rpt("callViewer", { id: (id || "").slice(0, 8) });
    const call = peer.call(id, stream);       // oferta COM trilhas
    viewers[id] = call;
    watchPC(call.peerConnection, "host");
    call.on("close", () => { delete viewers[id]; rpt("call.close"); });
    say('<span class="dot"></span>celular conectado ✓<br><small>transmitindo.</small>');
  }

  let peer;
  function start() {
    peer = new Peer(ROOM, PEER_OPTS);
    peer.on("open", () => { rpt("peer.open"); say('<span class="dot"></span>online — esperando o celular…<br><small>pode minimizar. LED da câmera fica aceso.</small>'); });
    // viewer chega e anuncia presença via data-channel:
    peer.on("connection", conn => {
      rpt("conn.in", { peer: (conn.peer || "").slice(0, 8) });
      conns.add(conn);
      conn.on("close", () => conns.delete(conn));
      conn.on("data", d => {
        if (d === "hi") { callViewer(conn.peer); try { conn.send(recMsg()); } catch (e) {} }
        else if (d && d.rec === "start") recStart(stream);
        else if (d && d.rec === "stop")  recStop();
      });
    });
    // fallback: se um viewer antigo ligar direto, responde com a stream:
    peer.on("call", call => { rpt("call.in"); call.answer(stream); watchPC(call.peerConnection, "host-ans"); });
    peer.on("disconnected", () => { rpt("peer.disc"); peer.reconnect(); });
    peer.on("error", err => {
      rpt("peer.err", { t: err.type });
      if (err.type === "unavailable-id") {
        say("<b>já tem um HOST aberto</b><br>Feche o outro. Retentando…");
        setTimeout(() => { try { peer.destroy(); } catch(e){} start(); }, 5000);
      }
    });
  }
  start();
}

/* ================================  VIEW (celular)  =========================
   Viewer abre data-channel pro host (anuncia presença) e ESPERA a chamada.
   ========================================================================== */
async function runView(key) {
  ROLE = "VIEW";
  const ROOM = await roomFromKey(key);
  rpt("boot", { b: BUILD, room: ROOM.slice(0, 12) });
  say('<span class="dot"></span>conectando…');
  let peer, conn, retry, got = false, tries = 0;

  // ---- rec: botão manda comando; estado vem do host
  let recOn = false, recSince = 0;
  function recUI() {
    recBtn.classList.toggle("on", recOn);
    recBtn.textContent = recOn ? "■ parar" : "● rec";
    recInfo.textContent = recOn ? hms(Date.now() - recSince) : "";
  }
  recBtn.onclick = () => {
    try { conn.send({ rec: recOn ? "stop" : "start" }); } catch (e) {}
    recBtn.disabled = true;                   // reabilita quando o host responder
    setTimeout(() => { recBtn.disabled = !(conn && conn.open); }, 3000);
  };
  setInterval(() => { if (recOn) recUI(); }, 1000);
  bar.classList.remove("hidden");

  function announce() {
    clearTimeout(retry);
    tries++;
    rpt("announce", { n: tries });
    try { if (conn) conn.close(); } catch (e) {}
    conn = peer.connect(ROOM, { reliable: true });
    conn.on("open", () => { rpt("conn.open"); try { conn.send("hi"); } catch (e) {} });
    conn.on("data", d => {
      if (!d || typeof d.rec !== "boolean") return;
      recOn = d.rec; recSince = Date.now() - (d.el || 0);
      recBtn.disabled = false; recUI();
    });
    conn.on("close", () => { recBtn.disabled = true; });
    conn.on("error", e => rpt("conn.err", { e: String(e.type || e).slice(0, 30) }));
    // se não receber vídeo em 12s, reanuncia
    retry = setTimeout(() => { if (!got) { rpt("timeout.noStream"); announce(); } }, 12000);
  }

  function start() {
    got = false;
    peer = new Peer(PEER_OPTS);
    peer.on("open", id => { rpt("peer.open", { id: (id||"").slice(0,8) }); announce(); });
    peer.on("call", call => {
      rpt("call.in");
      call.answer();                          // só recebe
      watchPC(call.peerConnection, "view");
      call.on("stream", remote => {
        if (video.srcObject === remote) return;
        rpt("stream.get", { tracks: remote.getTracks().map(t => t.kind) });
        got = true; clearTimeout(retry);
        video.srcObject = remote; hide();
        video.play().then(() => rpt("play.ok")).catch(e => rpt("play.fail", { e: String(e.name||e).slice(0,30) }));
        if (video.muted) tap.classList.add("show");
      });
      call.on("close", () => { got = false; rpt("call.close"); say('<span class="dot"></span>reconectando…'); announce(); });
    });
    peer.on("disconnected", () => { rpt("peer.disc"); peer.reconnect(); });
    peer.on("error", err => {
      rpt("peer.err", { t: err.type });
      if (err.type === "peer-unavailable")
        say('<span class="dot"></span>HOST offline — abra <b>?host</b> no PC.<br>tentando…');
      clearTimeout(retry); retry = setTimeout(() => { if (!got) announce(); }, 3000);
    });
  }

  tap.addEventListener("click", () => {
    video.muted = false; video.play().catch(() => {});
    tap.classList.remove("show");
  });
  start();
}

/* ==============================  ROTEADOR  ================================= */
(async () => {
  if (!mode) {
    say("<b>cam</b><br><br>PC (webcam): abra <b>?host</b><br>"
      + "Celular: abra <b>?view</b>");
    return;
  }
  const key = getKey() || "cam-padrao";
  if (mode === "host") runHost(key);
  else runView(key);
})();
</script>
</body>
</html>
